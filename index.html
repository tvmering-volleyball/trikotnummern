<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trikotnummern 2026/27</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7385;
    --line: #e2e5ec; --head: #24405e; --head-text: #ffffff; --stripe: #f1f4f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --card: #1a2029; --text: #e6e9ef; --muted: #8b93a5;
      --line: #2a3240; --head: #2f5482; --head-text: #ffffff; --stripe: #1f2631;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  #status { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  .wrap {
    overflow-x: auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #1B2A41; color: #ffffff; font-weight: 600; position: sticky; top: 0; }
  /* Zeilenfarben nach Team (feste Farben, dunkle Schrift) */
  tbody td { background: #e3e5e8; color: #1d2330; }
  tbody tr.damen td { background: #ead1dc; }
  tbody tr.herren2 td { background: #d9ead3; }
  tbody tr.herren1 td { background: #cfe2f3; }
  tbody tr.jugend td { background: #fff2cc; }
  tbody tr.frei td { background: #ffffff; }
  tbody tr.sektion td { font-weight: 700; }
  tbody tr:last-child td { border-bottom: 0; }
  .msg { padding: 24px; color: var(--muted); }
  .error { color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1 id="title">Trikotnummern 2026/27</h1>
  <p id="status">Lade Daten …</p>
  <div class="wrap"><div id="out" class="msg">Lade Daten …</div></div>
</main>

<script>
  // === Einstellungen ===
  const SHEET_ID = "18Gd8IW49UAil4mviWdw82ILrzjKjRqRykiRCklr76ps";
  const SHEET_GID = "";          // optional: gid des Tabellenblatts (steht in der URL nach "gid="), leer = erstes Blatt
  const REFRESH_SECONDS = 60;    // automatische Aktualisierung
  const PAGE_TITLE = "Trikotnummern 2026/27";  // Überschrift der Seite
  // =====================

  document.title = PAGE_TITLE;
  document.getElementById("title").textContent = PAGE_TITLE;

  const BASE = "https://docs.google.com/spreadsheets/d/" + SHEET_ID;
  const GID = SHEET_GID ? "&gid=" + SHEET_GID : "";
  // 1. Export liefert alle Zellen unverändert (auch Text wie "--" in Zahlenspalten)
  // 2. gviz dient als Fallback, kann aber Text in Zahlenspalten weglassen
  const URLS = [
    BASE + "/export?format=csv" + GID,
    BASE + "/gviz/tq?tqx=out:csv" + GID
  ];

  async function fetchCSV() {
    let lastErr;
    for (const u of URLS) {
      try {
        const res = await fetch(u, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.text();
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function render(rows) {
    const out = document.getElementById("out");
    out.className = ""; out.textContent = "";
    if (!rows.length) { out.className = "msg"; out.textContent = "Die Tabelle ist leer."; return; }
    const table = document.createElement("table");
    const thead = table.createTHead().insertRow();
    rows[0].forEach(h => { const th = document.createElement("th"); th.textContent = h; thead.appendChild(th); });
    const tbody = table.createTBody();
    const teamCol = rows[0].findIndex(h => h.trim().toLowerCase() === "team");
    const teamClass = { "damen": "damen", "herren 2": "herren2", "herren 1": "herren1", "jugend": "jugend" };
    rows.slice(1).forEach(r => {
      if (r.every(v => v.trim() === "")) return;
      const tr = tbody.insertRow();
      // Freie Zeile: "--" in der Team-Spalte -> eine große weiße Zelle über die ganze Breite
      if (teamCol >= 0 && (r[teamCol] ?? "").trim() === "--") {
        tr.className = "frei";
        const td = tr.insertCell();
        td.colSpan = rows[0].length;
        td.textContent = "\u00a0";
        return;
      }
      // Sektionsüberschrift: alle Spalten haben denselben Inhalt -> eine Zelle über die ganze Breite, fett
      const vals = rows[0].map((_, i) => (r[i] ?? "").trim());
      if (vals.length > 1 && vals[0] !== "" && vals.every(v => v === vals[0])) {
        const cls = teamClass[vals[0].toLowerCase()];
        tr.className = "sektion" + (cls ? " " + cls : "");
        const td = tr.insertCell();
        td.colSpan = vals.length;
        td.textContent = vals[0];
        return;
      }
      if (teamCol >= 0) {
        const cls = teamClass[(r[teamCol] ?? "").trim().toLowerCase()];
        if (cls) tr.className = cls;
      }
      rows[0].forEach((_, i) => { tr.insertCell().textContent = r[i] ?? ""; });
    });
    out.appendChild(table);
  }

  async function load() {
    const status = document.getElementById("status");
    try {
      render(parseCSV(await fetchCSV()));
      status.className = "";
      status.textContent = "Zuletzt aktualisiert: " + new Date().toLocaleTimeString("de-DE");
    } catch (e) {
      status.textContent = "";
      const out = document.getElementById("out");
      out.className = "msg error";
      out.textContent = "Die Tabelle konnte nicht geladen werden. Ist sie für „Jeder mit dem Link“ freigegeben?";
    }
  }

  load();
  setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
